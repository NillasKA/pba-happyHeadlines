name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare evidence directory
        run: mkdir -p evidence
      - run: dotnet restore HappyHeadlines.slnx
      - run: dotnet build HappyHeadlines.slnx -c Release --no-restore
      - name: Run unit tests
        run: dotnet test HappyHeadlines.slnx -c Release --no-build --logger trx --results-directory "$GITHUB_WORKSPACE/evidence/tests"
      - run: bash scripts/build.sh
      - run: docker compose up -d --build --scale article-service=2
      - name: Integration smoke test
        run: set -o pipefail; bash scripts/smoke-test.sh 2>&1 | tee evidence/smoke.log
      - name: Resilience integration test
        run: set -o pipefail; timeout 300s bash scripts/resilience-smoke.sh 2>&1 | tee evidence/resilience.log
      - name: Measure application and runtime images
        run: |
          set -o pipefail
          bash scripts/seed-gaf.sh 2>&1 | tee evidence/seed.log
          docker pull mcr.microsoft.com/dotnet/aspnet:10.0
          docker pull mcr.microsoft.com/dotnet/aspnet:10.0-noble-chiseled-extra
          bash scripts/measure-gaf.sh 2>&1 | tee evidence/gaf-measurements.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture browser evidence
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/capture-evidence.mjs
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > evidence/compose.log 2>&1 || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            evidence/
            artifacts/evidence/
          if-no-files-found: warn
      - if: always()
        run: docker compose down
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/build.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tagged images
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          export IMAGE_TAG="$RELEASE_TAG"
          docker compose build article-service article-prefill comment-service newsletter-service publisher-service profanity-service subscriber-service
          docker compose push article-service article-prefill comment-service newsletter-service publisher-service profanity-service subscriber-service
