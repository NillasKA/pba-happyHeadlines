server {
    listen 8080;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /publish {
        set $publisher http://publisher-service:8080;
        proxy_pass $publisher;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/articles/[^/]+/comments/?$ {
        set $comment_service http://comment-service:8080;
        proxy_pass $comment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region $http_x_region;
    }

    location /articles {
        set $article_service http://article-service:8080;
        proxy_pass $article_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region $http_x_region;
    }

}
